services:
  postgres:
    container_name: !reset null
    ports: !reset []
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: ${DOCKERHUB_REPO:-redgreen-back-api}:${IMAGE_TAG:-latest}
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-redgreen}
      POSTGRES_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  unit-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.unit-tests
    volumes:
      - unit_reports:/app/reports

  e2e-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e-tests
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - e2e_results:/app/test-results

volumes:
  unit_reports:
  e2e_results:
