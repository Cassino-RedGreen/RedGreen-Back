server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /reports/ {
    alias /usr/share/nginx/html/reports/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
