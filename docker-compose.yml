name: redgreen

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.database
    image: redgreen-database:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-redgreen}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: redgreen-back-api:local
    restart: unless-stopped
    environment:
      PORT: '3000'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-redgreen}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting the API}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  performance:
    build:
      context: .
      dockerfile: docker/Dockerfile.performance
    image: redgreen-performance:local
    profiles:
      - performance
    environment:
      BASE_URL: http://api:3000
    command: ['sleep', 'infinity']
    volumes:
      - ./test/performance/artifacts:/workspace/test/performance/artifacts
    depends_on:
      api:
        condition: service_healthy

  unit-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.unit-tests
    image: redgreen-unit-tests:local
    restart: unless-stopped

  e2e-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e-tests
    image: redgreen-e2e-tests:local
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins
    image: redgreen-jenkins:local
    restart: unless-stopped
    env_file:
      - .env
    group_add:
      - '${DOCKER_SOCKET_GID:-0}'
    ports:
      - '127.0.0.1:${JENKINS_PORT:-8080}:8080'
    volumes:
      - jenkins_home:/var/jenkins_home
      - reports_data:/var/jenkins_reports
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:?Set JENKINS_ADMIN_USER in .env before starting Jenkins}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in .env before starting Jenkins}
      REPORTS_VOLUME_PATH: /var/jenkins_reports
      REPORT_SERVER_URL: ${REPORT_SERVER_URL:-http://localhost:8088}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/login']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mailpit:
        condition: service_started
      report-server:
        condition: service_healthy
      unit-tests:
        condition: service_started
      e2e-tests:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  report-server:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REPORT_SERVER_PORT:-8088}:80'
    volumes:
      - reports_data:/usr/share/nginx/html/reports:ro
      - ./docker/report-server/index.html:/usr/share/nginx/html/index.html:ro
      - ./docker/report-server/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      report-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5

  report-volume-init:
    image: alpine:3.22
    restart: 'no'
    command:
      [
        'sh',
        '-c',
        'mkdir -p /reports/unit /reports/e2e && chown -R 1000:1000 /reports && chmod 775 /reports /reports/unit /reports/e2e',
      ]
    volumes:
      - reports_data:/reports

volumes:
  postgres_data:
  jenkins_home:
  reports_data:
