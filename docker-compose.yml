services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  unit-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.unit-tests
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    image: redgreen-back:unit-tests
    profiles: ['test']
    volumes:
      - unit_reports:/app/reports

  e2e-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e-tests
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    image: redgreen-back:e2e-tests
    profiles: ['test']
    volumes:
      - e2e_reports:/app/test-results

volumes:
  postgres_data:
  unit_reports:
  e2e_reports:
