name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      rate:
        description: 'Iterations per second for the load test'
        required: false
        default: '2'
        type: string
      duration:
        description: 'Duration of the load test, e.g., 30s or 2m'
        required: false
        default: '30s'
        type: string
      preallocated_vus:
        description: 'VU starting amount'
        required: false
        default: '5'
        type: string
      max_vus:
        description: 'VU maximum amount'
        required: false
        default: '20'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, format, audit]
    # success() here is required because a custom `if` replaces the default
    # "needs succeeded" check, so it has to be spelled out explicitly.
    if: >-
      success() &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # success() here is required because a custom `if` replaces the default
    # "needs succeeded" check, so it has to be spelled out explicitly.
    if: >-
      success() &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  load-tests:
    name: Load and Stress Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ${{ vars.POSTGRES_USER }} -d ${{ vars.POSTGRES_DB }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: 0
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_SSL: ${{ vars.POSTGRES_SSL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: ${{ vars.PORT || '3000' }}
      BASE_URL: http://localhost:${{ vars.PORT || '3000' }}
      SLOT_MACHINE_ID: 1
      RATE: ${{ inputs.rate || '2' }}
      DURATION: ${{ inputs.duration || '30s' }}
      PREALLOCATED_VUS: ${{ inputs.preallocated_vus || '5' }}
      MAX_VUS: ${{ inputs.max_vus || '20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build

      - name: Start API
        run: |
          npm run start:prod > api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail "$BASE_URL/api" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run load and stress tests
        run: npm run test:performance

      - name: Upload load-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-reports
          path: |
            test/performance/artifacts/combined-report.html
            test/performance/artifacts/index.html
            test/performance/artifacts/load-report.json
            test/performance/artifacts/load-report.html
            test/performance/artifacts/stress-report.json
            test/performance/artifacts/stress-report.html
            api.log
          if-no-files-found: warn

  publish-performance-pages:
    name: Publish Performance Report
    runs-on: ubuntu-latest
    needs: load-tests
    if: >-
      always() &&
      needs.load-tests.result != 'skipped' &&
      needs.load-tests.result != 'cancelled'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download performance reports
        uses: actions/download-artifact@v4
        with:
          name: k6-load-test-reports
          path: .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: test/performance/artifacts

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
